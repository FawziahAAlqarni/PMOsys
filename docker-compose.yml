services:
  # --- Frontend (React) ---
  fe:
    build:
      context: ./fe
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3000} # تأكدنا من البورت 3000
    ports:
      - "8008:8008"
    environment:
      - NODE_ENV=production
    depends_on:
      - be
    networks:
      - app-network

  # --- Backend (NestJS) ---
  be:
    build:
      context: ./be
    ports:
      - "3000:3000" # البورت الخارجي : البورت الداخلي
    environment:
      - NODE_ENV=production
      - PORT=3000
      # إعدادات الاتصال بقاعدة البيانات (مهم جداً)
      - DB_HOST=postgres       # داخل الدوكر نستخدم اسم الخدمة وليس localhost
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE=${DB_NAME:-project_management}
    networks:
      - app-network
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # --- Database (PostgreSQL) ---
  postgres:
    image: postgres:15-alpine # نسخة مستقرة وخفيفة (18 لم تصدر رسميا بعد، 15 او 16 افضل)
    container_name: pmo_db_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-project_management}
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # لحفظ البيانات عند إغلاق الكونتينر
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: